name: 오늘의 재벌 동향 갱신

on:
  schedule:
    # 평일 19:40, 23:00 (KST) — 장 마감 후 공시와 늦은 공시를 한 번 더
    - cron: "40 10 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DART 공시 수집
        run: python tools/update_today.py
      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- data; then
            git status --porcelain -- data | grep -q . || { echo "변경 없음"; exit 0; }
          fi
          git config user.name "chaebol-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "오늘의 재벌 동향 $(date -u -d '+9 hours' +%Y-%m-%d) 갱신"
          git push
